[project]
name = "opmd-pred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "linexox", email = "linexox7@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "pyarrow>=17.0",
    "joblib>=1.4",
]

[project.scripts]
opmd-pred = "opmd_pred:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
